<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>blixt/phonon</title>
<meta name="description" content="{{tagline-text}}" />
<meta name="theme-color" content="#fbf5f2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171312" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='14' width='6' height='15' rx='2' fill='%23e0625a'/%3E%3Crect x='13' y='4' width='6' height='25' rx='2' fill='%23e0625a'/%3E%3Crect x='23' y='10' width='6' height='19' rx='2' fill='%23e0625a'/%3E%3C/svg%3E" />
</head>
<body>
<header class="top wrap">
  <a class="mark" href="#">blixt/phonon</a>
  <nav>
    <a href="#results">Results</a>
    <a href="#use-it">Use it</a>
    <a href="#how-it-works">How it works</a>
    <a class="gh" href="https://github.com/blixt/phonon">GitHub</a>
  </nav>
</header>
<main>
<section class="hero wrap">
  <h1>{{tagline}}</h1>
  <div class="grid">
    <section class="card demo" id="demo" aria-label="Try it">
      <select id="model" class="model" aria-label="Model" autocomplete="off">{{models}}</select>
      <div class="field">
        <textarea id="text" aria-label="Text to speak">The birch canoe slid on the smooth planks. Glue the sheet to the dark blue background.</textarea>
        <p class="words" id="words" aria-live="off"></p>
      </div>
      <div class="controls">
        <select id="voice" aria-label="Voice"><option>Delia</option></select>
        <label>Speed <input id="speed" type="range" min="0.8" max="1.3" step="0.05" value="1" /><output id="speed-out">1.0×</output></label>
        <button class="speak" id="speak">Speak</button>
      </div>
      <div class="stats">
        <div class="stat" id="s-load"><b>{{download-mb}} MB</b><span>download</span></div>
        <div class="stat" id="s-first"><b>–</b><span>first audio</span></div>
        <div class="stat" id="s-speed"><b>–</b><span>real time</span></div>
        <div class="stat" id="s-audio"><b>–</b><span>speech made</span></div>
      </div>
      <p class="device" id="device">&nbsp;</p>
    </section>
    <section class="card bench" id="bars" aria-label="Benchmarks">{{bars}}</section>
  </div>
</section>
<div class="docs wrap">
{{sections}}
</div>
</main>
<script type="module" src="site.js"></script>
</body>
</html>
