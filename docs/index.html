<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phonon on WebGPU</title>
<style>
  body { font: 17px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
  textarea { width: 100%; font: inherit; min-height: 6rem; box-sizing: border-box; }
  .row { display: flex; gap: 0.75rem; align-items: center; margin: 0.75rem 0; flex-wrap: wrap; }
  #words span { padding: 0 1px; border-radius: 3px; }
  #words span.now { background: #ffe58a; }
  #status { color: #6e6e73; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } #words span.now { background: #6b5800; } }
</style>
<h1>Phonon on WebGPU</h1>
<textarea id="text">The birch canoe slid on the smooth planks. Glue the sheet to the dark blue background.</textarea>
<div class="row">
  <select id="voice"></select>
  <label>Speed <input id="speed" type="range" min="0.8" max="1.3" step="0.1" value="1" /></label>
  <button id="speak" disabled>Speak</button>
</div>
<p id="status">Loading the model…</p>
<p id="words"></p>
<p><a href="listen.html">Listen to the benchmark phrases side by side</a> · <a href="https://github.com/blixt/phonon">Source</a></p>
<script type="module" src="demo.js"></script>
</html>
